name: CI

# Runs on PRs targeting main (so you see green/red before merging) and on
# pushes to main (which is what the README badge tracks). Plain pushes to a
# feature branch trigger nothing until a PR is opened.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (elixir ${{ matrix.elixir }} / otp ${{ matrix.otp }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Floor — the lowest supported pairing (consumer floor is
          # ~> 1.18 / OTP 28: Linx.Tty drives the OTP-28 prim_tty internals).
          - elixir: "1.18"
            otp: "28"
            os: ubuntu-24.04
          # Latest — mirrors the pinned dev toolchain (.tool-versions).
          # Formatter output is version-sensitive, so the format check
          # runs only on this cell.
          - elixir: "1.19"
            otp: "28"
            os: ubuntu-24.04
            lint: true
          # aarch64 — the aarch64 seccomp syscall table (and every other
          # arch-sensitive path) is otherwise never exercised on real
          # hardware. GitHub's arm runners are free for public repos.
          - elixir: "1.19"
            otp: "28"
            os: ubuntu-24.04-arm
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-otp${{ matrix.otp }}-elixir${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-otp${{ matrix.otp }}-elixir${{ matrix.elixir }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        if: matrix.lint
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      # The :integration tests (root / privileged kernel access) are
      # excluded by default in test_helper.exs, so this runs the
      # non-privileged suite. The privileged job below covers the rest.
      - name: Run tests
        run: mix test --warnings-as-errors

  # The kernel-mutating paths (rtnl writes, nf_tables commits, mount /
  # user-ns / capabilities apply, Linx.Reconcile) only execute under
  # root — without this job a release can ship green with a regressed
  # encoder. GitHub's runners grant passwordless sudo; deps compile as
  # the runner user first so root only executes, mirroring sudotest.sh.
  privileged:
    name: test (privileged, elixir 1.19 / otp 28)
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp28-elixir1.19-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp28-elixir1.19-

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix deps.get

      - name: Compile
        run: mix compile

      # HOME is preserved so root finds the runner's ~/.mix (the Hex
      # archive provides the SCM for hex deps — without it even `mix
      # test` on already-fetched deps fails to load the project).
      - name: Run full suite as root (includes :integration)
        run: sudo --preserve-env=PATH,HOME,MIX_ENV,MIX_HOME env "PATH=$PATH" "$(which mix)" test --include integration

  # Dialyzer enforces the @spec-on-every-public-function policy (AGENTS.md);
  # deliberate skips live in .dialyzer_ignore.exs, and unused skips fail the
  # run (list_unused_filters), so the ignore file can't rot. Runs in dev
  # (dialyxir is a dev-only dep); the PLT lands in _build/dev and rides the
  # same cache shape as the test jobs.
  dialyzer:
    name: dialyzer (elixir 1.19 / otp 28)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Cache deps, build, and PLT
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-dialyzer-otp28-elixir1.19-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-dialyzer-otp28-elixir1.19-

      - name: Install dependencies
        run: mix deps.get

      - name: Run dialyzer
        run: mix dialyzer

  release-quality:
    name: docs and package (elixir 1.19 / otp 28)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-release-otp28-elixir1.19-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-otp28-elixir1.19-

      - name: Install dependencies
        run: mix deps.get

      - name: Build documentation
        run: mix docs --warnings-as-errors

      # mix hex.build validates the manifest and prints every packaged file,
      # including the native sources and their custom compiler modules.
      - name: Build Hex package
        run: mix hex.build

  process-sanitizers:
    name: process port (ASan + UBSan)
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
      LINX_SANITIZE: address,undefined
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Cache dependencies and sanitized build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-sanitizers-otp28-elixir1.19-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      # These suites exercise the standalone linx_process Port. Leak detection
      # is meaningful here because each instrumented agent is a short-lived,
      # isolated OS process.
      - name: Run Process suites
        run: mix test test/linx/process_test.exs test/linx/process_supervision_test.exs --warnings-as-errors

      - name: Locate ASan runtime
        run: echo "LIBASAN=$(cc -print-file-name=libasan.so)" >> "$GITHUB_ENV"

      # NIF instrumentation needs libasan loaded before beam.smp. Leak
      # detection is disabled because it would report allocations owned by
      # the VM and other applications; bounds and undefined-behaviour checks
      # remain fail-fast.
      - name: Run NIF suites
        env:
          LD_PRELOAD: ${{ env.LIBASAN }}
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
        run: >-
          mix test
          test/linx/mount_test.exs
          test/linx/sysctl_test.exs
          test/linx/tty_test.exs
          test/linx/netlink/socket_test.exs
          --warnings-as-errors
